plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wallgames.mathduel'
    compileSdk 34

    defaultConfig {
        applicationId "com.wallgames.mathduel"
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName "1.3-test"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
