<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Math Duel</title>
<style>
@font-face{font-family:"Game";src:url(font.woff2) format("woff2");font-weight:800}
:root{
  --bg:#140A3E; --bg2:#1F1260; --p1:#16CFF2; --p1d:#0B6F86; --p2:#FF7A1A; --p2d:#8A3A05;
  --sun:#FFC929; --ok:#7CE33A; --bad:#FF3B5C; --white:#FFFFFF;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:"Game","Arial Rounded MT Bold",Arial,sans-serif;touch-action:none}
#stage{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;background:radial-gradient(ellipse at 50% 35%,var(--bg2) 0%,var(--bg) 70%)}
.divider{display:none}

/* ---------- top bar ---------- */
.timer{position:absolute;left:50%;top:6vh;transform:translateX(-50%);min-width:18vw;padding:1vh 2vw;border-radius:3vh;background:rgba(255,255,255,.1);border:0.4vh solid rgba(255,255,255,.25);text-align:center;font-size:6vh;line-height:1.1;letter-spacing:.2vw}
.timer.low{color:var(--bad);border-color:var(--bad);animation:pulse .8s infinite}
.question{position:absolute;left:50%;top:34vh;transform:translateX(-50%);width:23vw;height:32vh;white-space:nowrap;overflow:hidden;border-radius:3vh;background:#fff;color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12vh;line-height:1;box-shadow:0 1vh 0 rgba(0,0,0,.25)}
.question.reveal{background:var(--sun)}

.player{position:absolute;top:31vh;width:22vw;text-align:center}
.player.p1{left:14vw}.player.p2{right:14vw}
.player .name{font-size:4.6vh;white-space:nowrap;letter-spacing:.3vw}
.p1 .name{color:var(--p1)}.p2 .name{color:var(--p2)}
.counter{margin:1vh auto 0;width:12vw;height:12vh;border-radius:2.5vh;display:flex;align-items:center;justify-content:center;font-size:9vh;line-height:1;color:var(--bg);position:relative}
.p1 .counter{background:var(--p1)}.p2 .counter{background:var(--p2)}
.bar{margin:1.2vh auto 0;width:16vw;height:1.6vh;border-radius:1vh;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:1vh;transition:width .3s}
.p1 .bar i{background:var(--p1)}.p2 .bar i{background:var(--p2)}
.plus{position:absolute;left:50%;top:-1vh;transform:translateX(-50%);font-size:7vh;color:var(--ok);opacity:0;pointer-events:none}
.plus.show{animation:plus 0.9s ease-out}

/* ---------- answer squares (kept well away from all edges) ---------- */
.ans{position:absolute;width:22vw;height:20vh;border-radius:3.5vh;display:flex;align-items:center;justify-content:center;font-size:13vh;line-height:1;color:#fff;border:0.8vh solid rgba(255,255,255,.85);box-shadow:0 1.2vh 0 rgba(0,0,0,.3);transition:transform .08s,opacity .2s}
.ans.p1{background:var(--p1d)}.ans.p2{background:var(--p2d)}
.ans.s1-a{left:14vw;top:2.5vh}.ans.s1-b{left:14vw;top:77.5vh}
.ans.s2-a{right:14vw;top:2.5vh}.ans.s2-b{right:14vw;top:77.5vh}
.ans.hit{transform:scale(.94)}
.ans.good{background:var(--ok)!important;color:var(--bg);border-color:#fff}
.ans.wrong{background:var(--bad)!important}
.lockmsg{position:absolute;top:63vh;width:22vw;text-align:center;font-size:4vh;color:var(--bad);opacity:0;pointer-events:none}
.lockmsg.l1{left:14vw}.lockmsg.l2{right:14vw}
.side-locked .lockmsg{opacity:1}

/* ---------- overlays ---------- */
.overlay{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;background:rgba(14,6,44,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:10}
.overlay.hidden{display:none}
.title{font-size:15vh;line-height:1;color:#fff}
.title span{color:var(--sun)}
.sub{font-size:4.2vh;color:#C9C0F2;margin-top:2.5vh;line-height:1.35;font-family:Arial,sans-serif;font-weight:700}
.btn{margin-top:6vh;padding:0 4vw;min-width:30vw;height:20vh;white-space:nowrap;border-radius:4vh;background:var(--ok);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:8vh;box-shadow:0 1.4vh 0 rgba(0,0,0,.35);animation:bob 1.6s ease-in-out infinite}
.btn.wait{background:#5D5680;color:#C9C0F2;animation:none}
.count{font-size:40vh;line-height:1;color:var(--sun);animation:zoom .9s ease-out}
.win{font-size:13vh;line-height:1.05}
.win.p1c{color:var(--p1)}.win.p2c{color:var(--p2)}.win.draw{color:var(--sun)}
.final{display:flex;margin-top:3vh;font-size:8vh}
.final span{margin:0 3vw}
.final .a{color:var(--p1)}.final .b{color:var(--p2)}
.reason{font-size:4vh;color:#C9C0F2;margin-top:1.5vh;font-family:Arial,sans-serif;font-weight:700}
.confetti{position:absolute;top:-5vh;width:1.4vw;height:2.6vh;border-radius:.4vh;opacity:.95;animation:fall linear forwards}

/* ---------- touch tester (test build) ---------- */
#dbg{position:fixed;left:50%;transform:translateX(-50%);bottom:1vh;z-index:50;font:bold 1.6vh Arial,sans-serif;max-width:24vw !important;text-align:center;color:#FFC929;background:rgba(0,0,0,.6);padding:.6vh 1vw;border-radius:1vh;pointer-events:none;max-width:60vw}
.tdot{position:fixed;z-index:60;width:6vh;height:6vh;margin:-3vh 0 0 -3vh;border-radius:50%;border:.6vh solid #FFC929;pointer-events:none;-webkit-animation:tfade 1.2s ease-out forwards;animation:tfade 1.2s ease-out forwards}
@-webkit-keyframes tfade{0%{-webkit-transform:scale(.4);opacity:1}100%{-webkit-transform:scale(1.6);opacity:0}}
@keyframes tfade{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.6);opacity:0}}
.btn.small{margin-top:3vh;height:13vh;min-width:26vw;font-size:5vh;background:#5D5680;color:#fff;animation:none;box-shadow:0 .8vh 0 rgba(0,0,0,.35)}
.btn.focus{outline:.8vh solid #FFC929;outline-offset:.6vh}
.btnrow{display:flex}
.btnrow .btn{margin-left:1.5vw;margin-right:1.5vw}
#sensorScreen{background:#140A3E}
.gcell{position:absolute;box-sizing:border-box;border:.25vh solid rgba(255,255,255,.35);background:rgba(255,255,255,.03);transition:background .15s}
.gcell b{position:absolute;left:1vw;top:1vh;font-size:4vh;color:rgba(255,255,255,.55)}
.gcell span{position:absolute;right:1vw;bottom:1vh;font-size:3vh;color:#FFC929;font-family:Arial,sans-serif;font-weight:700}
.gcell.seen{background:rgba(124,227,58,.18)}
.gcell.hit{background:rgba(124,227,58,.75)}
.caltext.wt{z-index:2;top:1vh;font-size:3.4vh;background:rgba(20,10,62,.8);display:inline-block;left:50%;right:auto;transform:translateX(-50%);padding:.5vh 2vw;border-radius:2vh}
.sdot{z-index:3;position:absolute;width:2.4vh;height:2.4vh;margin:-1.2vh 0 0 -1.2vh;border-radius:50%;background:#16CFF2;opacity:.9;pointer-events:none}
.sdot.out{background:#FF3B5C}
.calstatus.warn{color:#FFC929;font-size:4vh}
.calstatus{margin-top:2.5vh;font-size:3.2vh;color:#C9C0F2;font-family:Arial,sans-serif;font-weight:700}
.caltext{position:absolute;top:4vh;left:0;right:0;text-align:center;font-size:4.5vh;color:#FFC929}
#calTarget{position:absolute;width:14vh;height:14vh;margin:-7vh 0 0 -7vh;border-radius:50%;border:1.2vh solid #FFC929;animation:bob 1.2s ease-in-out infinite}
#calTarget i{position:absolute;left:50%;top:50%;width:3vh;height:3vh;margin:-1.5vh 0 0 -1.5vh;border-radius:50%;background:#FF2E93}
.testnote{font-size:3.4vh;color:#FFC929;margin-top:3vh;font-family:Arial,sans-serif;font-weight:700}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.08)}}
@keyframes shake{20%{transform:translateX(-1.2vw)}40%{transform:translateX(1.2vw)}60%{transform:translateX(-.8vw)}80%{transform:translateX(.8vw)}}
@keyframes plus{0%{opacity:0;transform:translate(-50%,2vh)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-8vh)}}
@keyframes bob{50%{transform:translateY(-1vh)}}
@keyframes zoom{0%{transform:scale(2.2);opacity:0}60%{opacity:1}100%{transform:scale(1)}}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
</style>
</head>
<body>
<div id="stage">
  <div class="divider"></div>
  <div class="timer" id="timer">3:00</div>
  <div class="question" id="question"><span>?</span></div>

  <div class="player p1"><div class="name">PLAYER 1</div><div class="counter"><span id="score1">0</span><div class="plus" id="plus1">+1</div></div><div class="bar"><i id="bar1"></i></div></div>
  <div class="player p2"><div class="name">PLAYER 2</div><div class="counter"><span id="score2">0</span><div class="plus" id="plus2">+1</div></div><div class="bar"><i id="bar2"></i></div></div>

  <div id="side1">
    <div class="ans p1 s1-a" data-p="1" data-i="0"></div>
    <div class="ans p1 s1-b" data-p="1" data-i="1"></div>
    <div class="lockmsg l1">Oops! Wait…</div>
  </div>
  <div id="side2">
    <div class="ans p2 s2-a" data-p="2" data-i="0"></div>
    <div class="ans p2 s2-b" data-p="2" data-i="1"></div>
    <div class="lockmsg l2">Oops! Wait…</div>
  </div>

  <div class="overlay" id="startScreen">
    <div class="title">MATH <span>DUEL</span></div>
    <div class="sub">Solve the sum and hit the right answer on your side!<br>First to 10 wins · 3 minutes</div>
    <div class="btn" id="startBtn">START</div>
    <div class="btnrow"><div class="btn small" id="sensorBtn">WALL TEST</div></div>
    <div class="calstatus" id="calStatus"></div>
    <div id="calBtn" style="display:none"></div>
  </div>
  <div class="overlay hidden" id="calScreen">
    <div class="caltext" id="calText">CALIBRATION</div>
    <div id="calTarget"><i></i></div>
  </div>
  <div class="overlay hidden" id="sensorScreen"><div class="caltext wt" id="sensorText">WALL TEST</div></div>
  <div class="overlay hidden" id="countScreen"><div class="count" id="countNum">3</div></div>
  <div class="overlay hidden" id="endScreen">
    <div class="win" id="winText">PLAYER 1 WINS!</div>
    <div class="final"><span class="a" id="final1">0</span><span>–</span><span class="b" id="final2">0</span></div>
    <div class="reason" id="reason"></div>
    <div class="btn wait" id="againBtn">PLAY AGAIN</div>
  </div>
</div>
<div id="dbg">Touch test: waiting…</div>

<script>
(function(){
  "use strict";
  // ---------------- settings ----------------
  var WIN_SCORE   = 10;     // first to this many wins
  var GAME_SECS   = 180;    // 3 minutes
  var LOCK_MS     = 800;    // pause for a player who hits the wrong answer
  var NEXT_MS     = 1100;   // pause showing the answer before the next question
  var DEBOUNCE_MS = 250;    // ignore double-hits from the sensor
  var AGAIN_DELAY = 3000;   // "Play again" becomes active after this

  // ---------------- state ----------------
  var score = {1:0, 2:0};
  var answers = {1:[0,0], 2:[0,0]};   // values shown in each player's two squares
  var correct = 0, lastQ = "";
  var accepting = false, running = false;
  var locked = {1:false, 2:false};
  var lastHit = {1:0, 2:0};
  var timeLeft = GAME_SECS, tick = null, againReady = false;

  var $ = function(id){ return document.getElementById(id); };
  var boxes = Array.prototype.slice.call(document.querySelectorAll(".ans"));

  // ---------------- sound (generated, no files needed) ----------------
  var ac = null;
  function audio(){ if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac && ac.state==="suspended"){ ac.resume(); } }
  function tone(freq, dur, type, when, vol){
    if(!ac) return;
    var t = ac.currentTime + (when||0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type||"sine"; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol||0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+0.02);
  }
  var sfx = {
    good: function(){ tone(660,.12,"triangle",0); tone(990,.22,"triangle",.1); },
    bad:  function(){ tone(180,.3,"sawtooth",0,.18); },
    beep: function(){ tone(520,.15,"square",0,.15); },
    go:   function(){ tone(880,.35,"square",0,.18); },
    win:  function(){ [523,659,784,1047].forEach(function(f,i){ tone(f,.3,"triangle",i*.15); }); }
  };

  // ---------------- questions (age 8: + and − within 20) ----------------
  function rnd(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
  function makeQuestion(){
    var a,b,op,q,ans;
    do{
      if(Math.random() < 0.5){ a = rnd(1,10); b = rnd(1,10); op = "+"; ans = a+b; }
      else { a = rnd(5,20); b = rnd(1,a-1); op = "−"; ans = a-b; }
      q = a + " " + op + " " + b;
    } while(q === lastQ);
    lastQ = q;
    var wrong;
    do{ wrong = ans + [-3,-2,-1,1,2,3][rnd(0,5)]; } while(wrong < 0 || wrong === ans);
    return {text:q, ans:ans, wrong:wrong};
  }

  function nextQuestion(){
    var q = makeQuestion();
    correct = q.ans;
    $("question").textContent = q.text;
    $("question").classList.remove("reveal");
    fitText($("question"), 11);
    [1,2].forEach(function(p){
      // each side gets its own random order, so players can't copy each other
      answers[p] = Math.random() < 0.5 ? [q.ans, q.wrong] : [q.wrong, q.ans];
    });
    boxes.forEach(function(b){
      var p = +b.getAttribute("data-p"), i = +b.getAttribute("data-i");
      b.textContent = answers[p][i];
      b.classList.remove("good","wrong","hit");
    });
    accepting = true;
    settle(1); settle(2);
  }

  // shrink text until it fits its box (works on any screen shape)
  function fitText(el, maxVh){
    var txt = el.textContent, span = document.createElement("span");
    span.textContent = txt; span.style.display = "inline-block";
    el.textContent = ""; el.appendChild(span);
    var size = maxVh, room = el.clientWidth * 0.9;
    el.style.fontSize = size + "vh";
    while(span.offsetWidth > room && size > 4){ size -= 0.5; el.style.fontSize = size + "vh"; }
  }

  // ---------------- input ----------------
  function onHit(e){
    if(e.cancelable) e.preventDefault();
    hitBox(e.currentTarget);
  }
  function hitBox(b){
    audio();
    var p = +b.getAttribute("data-p"), i = +b.getAttribute("data-i");
    var now = Date.now();
    if(!running || !accepting || locked[p]) return;
    if(now - lastHit[p] < DEBOUNCE_MS) return;
    lastHit[p] = now;
    b.classList.add("hit"); setTimeout(function(){ b.classList.remove("hit"); }, 120);

    if(answers[p][i] === correct){
      accepting = false;
      score[p]++;
      b.classList.add("good");
      sfx.good();
      updateScores(p);
      $("question").classList.add("reveal");
      if(score[p] >= WIN_SCORE){ setTimeout(function(){ endGame("first to " + WIN_SCORE); }, 700); }
      else { setTimeout(function(){ if(running) nextQuestion(); }, NEXT_MS); }
    } else {
      b.classList.add("wrong");
      sfx.bad();
      locked[p] = true;
      $("side"+p).classList.add("side-locked");
      setTimeout(function(){
        locked[p] = false;
        $("side"+p).classList.remove("side-locked");
        settle(p);
        b.classList.remove("wrong");
      }, LOCK_MS);
    }
  }
  boxes.forEach(function(b){
    if(window.PointerEvent){ b.addEventListener("pointerdown", onHit); }
    else { b.addEventListener("touchstart", onHit, {passive:false}); b.addEventListener("mousedown", onHit); }
  });

  function onButton(el, fn){
    var handler = function(e){ if(e.cancelable) e.preventDefault(); audio(); fn(); };
    if(window.PointerEvent){ el.addEventListener("pointerdown", handler); }
    else { el.addEventListener("touchstart", handler, {passive:false}); el.addEventListener("mousedown", handler); }
  }
  onButton($("startBtn"), function(){ if(!running) countdown(); });
  onButton($("againBtn"), function(){ if(againReady) countdown(); });
  onButton($("calBtn"), function(){ if(!running && !calibrating) startCalibration(); });
  // ---------------- wall hits from the IR camera (TUIO, delivered by the Android app) ----------------
  // nx, ny arrive as 0..1 positions from the camera. They go through:
  //   1) calibration (corrects the camera's offset/stretch), 2) edge filter,
  //   3) contact tracking (one touch = one tap, single-frame flickers dropped),
  //   4) target check (only the answer squares and buttons react).
  var MERGE_DIST = 0.07;   // repeats closer than this (fraction of screen) are the same touch
  var MERGE_MS   = 450;    // a touch must leave for this long before it can count again
  var CONFIRM    = 2;      // a touch must be seen in this many camera frames (drops noise)
  var EDGE       = 0.03;   // ignore the very edges
  var wallHits = 0, wallRaw = 0, contactsList = [], ghostBlocked = 0;

  // ---- settle time: the camera sees screen changes as "hits", so after a side
  //      changes (new question, wrong flash ends) it ignores hits for a moment
  var SETTLE_MS = 400, settleUntil = {1:0, 2:0};
  function settle(p){ settleUntil[p] = Date.now() + SETTLE_MS; }

  // ---- hotspot filter: a spot that fires in most of the last 12 seconds is a
  //      reflection / sensor ghost, not a player
  var GRID_X = 24, GRID_Y = 14, HOT_WINDOW = 12, HOT_SECONDS = 8, cellSecs = {};
  function cellOf(nx, ny){ return Math.min(GRID_X-1, Math.max(0, Math.floor(nx*GRID_X))) + "," + Math.min(GRID_Y-1, Math.max(0, Math.floor(ny*GRID_Y))); }
  function markCell(nx, ny){
    var k = cellOf(nx, ny), sec = Math.floor(Date.now()/1000), a = cellSecs[k] || (cellSecs[k] = []);
    if(a[a.length-1] !== sec) a.push(sec);
    while(a.length && a[0] <= sec - HOT_WINDOW) a.shift();
  }
  function isHot(nx, ny){
    var sec = Math.floor(Date.now()/1000), cx = Math.floor(nx*GRID_X), cy = Math.floor(ny*GRID_Y);
    for(var dx=-1; dx<=1; dx++) for(var dy=-1; dy<=1; dy++){
      var a = cellSecs[(cx+dx) + "," + (cy+dy)];
      if(!a) continue;
      var n = 0; for(var i=0;i<a.length;i++) if(a[i] > sec - HOT_WINDOW) n++;
      if(n >= HOT_SECONDS) return true;
    }
    return false;
  }

  // ---- saved settings (Android app storage, browser storage as fallback)
  function load(key){
    try{ if(window.AppStore) return window.AppStore.load(key); }catch(e){}
    try{ return localStorage.getItem(key); }catch(e){ return null; }
  }
  function save(key, val){
    try{ if(window.AppStore){ window.AppStore.save(key, val); return; } }catch(e){}
    try{ localStorage.setItem(key, val); }catch(e){}
  }

  // ---- calibration: quadratic fit  screen = f(raw)  from 9 target points
  var CAL_KEY = "mathduel_cal_v2";
  var cal = null;
  // calibration not used: the Wall Test showed the sensor positions are already accurate
  // camera -> screen is a perspective transform (homography) for a flat wall
  function mapPt(x, y){
    if(!cal) return [x, y];
    var h = cal.h, w = h[6]*x + h[7]*y + 1;
    return [(h[0]*x + h[1]*y + h[2]) / w, (h[3]*x + h[4]*y + h[5]) / w];
  }
  // reject signals from outside the calibrated part of the camera image
  function inCalArea(x, y){
    if(!cal) return true;
    var b = cal.box, mx = (b[2]-b[0])*0.15, my = (b[3]-b[1])*0.15;
    return x >= b[0]-mx && x <= b[2]+mx && y >= b[1]-my && y <= b[3]+my;
  }
  function solve(A, b){ // Gaussian elimination, A is n x n
    var n = b.length, M = A.map(function(r, i){ return r.concat([b[i]]); });
    for(var c=0;c<n;c++){
      var piv = c;
      for(var r=c+1;r<n;r++) if(Math.abs(M[r][c]) > Math.abs(M[piv][c])) piv = r;
      var tmp = M[c]; M[c] = M[piv]; M[piv] = tmp;
      if(Math.abs(M[c][c]) < 1e-12) return null;
      for(var r2=0;r2<n;r2++){
        if(r2 === c) continue;
        var f = M[r2][c] / M[c][c];
        for(var k=c;k<=n;k++) M[r2][k] -= f * M[c][k];
      }
    }
    return M.map(function(r, i){ return r[n] / r[i]; });
  }
  function fit(raw, scr){ // least-squares homography from the 9 target points
    var AtA = [], Atb = [0,0,0,0,0,0,0,0], i, j, k;
    for(i=0;i<8;i++) AtA.push([0,0,0,0,0,0,0,0]);
    function add(row, b){ for(i=0;i<8;i++){ Atb[i] += row[i]*b; for(j=0;j<8;j++) AtA[i][j] += row[i]*row[j]; } }
    for(k=0;k<raw.length;k++){
      var x = raw[k][0], y = raw[k][1], u = scr[k][0], v = scr[k][1];
      add([x, y, 1, 0, 0, 0, -x*u, -y*u], u);
      add([0, 0, 0, x, y, 1, -x*v, -y*v], v);
    }
    var h = solve(AtA, Atb);
    if(!h) return null;
    var xs = raw.map(function(r){ return r[0]; }), ys = raw.map(function(r){ return r[1]; });
    var c = {h:h, box:[Math.min.apply(null, xs), Math.min.apply(null, ys), Math.max.apply(null, xs), Math.max.apply(null, ys)]};
    // sanity check: every target must map back close to where it was shown
    var save = cal; cal = c;
    for(k=0;k<raw.length;k++){ var m = mapPt(raw[k][0], raw[k][1]); if(Math.abs(m[0]-scr[k][0]) > 0.12 || Math.abs(m[1]-scr[k][1]) > 0.12){ cal = save; return null; } }
    cal = save;
    return c;
  }

  // ---- calibration screen
  // centre first (far from people standing at the sides), then corners, then edges
  var CAL_PTS = [[0.50,0.50],[0.22,0.25],[0.78,0.25],[0.22,0.78],[0.78,0.78]];
  // where should the current target appear in the camera image? (learned from accepted targets)
  function expectRaw(t){
    var n = calRaw.length;
    if(n === 0) return {x:t[0], y:t[1], r:0.38};
    if(n < 3){ var d0 = [calRaw[0][0]-CAL_PTS[0][0], calRaw[0][1]-CAL_PTS[0][1]]; return {x:t[0]+d0[0], y:t[1]+d0[1], r:0.30}; }
    // affine fit screen -> raw from the accepted targets
    var A = [[0,0,0],[0,0,0],[0,0,0]], bx = [0,0,0], by = [0,0,0];
    for(var k=0;k<n;k++){
      var v = [CAL_PTS[k][0], CAL_PTS[k][1], 1];
      for(var i=0;i<3;i++){ bx[i] += v[i]*calRaw[k][0]; by[i] += v[i]*calRaw[k][1]; for(var j=0;j<3;j++) A[i][j] += v[i]*v[j]; }
    }
    var ax = solve(A, bx), ay = solve(A, by);
    if(!ax || !ay) return {x:t[0], y:t[1], r:0.30};
    return {x:ax[0]*t[0]+ax[1]*t[1]+ax[2], y:ay[0]*t[0]+ay[1]*t[1]+ay[2], r:0.20};
  }
  var calibrating = false, calStep = 0, calRaw = [], calLast = 0, calCand = null;
  function startCalibration(){
    calibrating = true; calStep = 0; calRaw = []; calCand = null; calLast = 0;
    $("startScreen").classList.add("hidden");
    $("calScreen").classList.remove("hidden");
    showCalTarget();
  }
  function showCalTarget(){
    var p = CAL_PTS[calStep], t = $("calTarget");
    t.style.left = (p[0]*100) + "vw"; t.style.top = (p[1]*100) + "vh";
    $("calText").textContent = "CALIBRATION  " + (calStep+1) + " / " + CAL_PTS.length + "  —  touch the target and hold 1 second  ·  OK on remote = cancel";
  }
  var calSeen = 0, calHist = [];
  // a spot that was already sending signals before this moment is a person standing there, not a touch
  function isBackground(x, y, now){
    var n = 0;
    for(var i=0;i<calHist.length;i++){
      var h = calHist[i];
      if(h.t > now - 1500 && h.t < now - 400 && Math.abs(h.x - x) < 0.06 && Math.abs(h.y - y) < 0.06) n++;
    }
    return n >= 3;
  }
  function calHit(rx, ry){
    var now = Date.now();
    calSeen++;
    calFeedback(rx, ry);                             // show what the camera sees
    calHist.push({x:rx, y:ry, t:now});
    while(calHist.length && calHist[0].t < now - 2000) calHist.shift();
    if(now - calLast < 700) return;                  // one hit per target
    var e = expectRaw(CAL_PTS[calStep]), dx = rx - e.x, dy = ry - e.y;
    if(Math.sqrt(dx*dx + dy*dy) > e.r) return;       // far from where this target should be
    if(isBackground(rx, ry, now)) return;            // someone standing there, not a new touch
    // collect this touch for 150 ms (one frame is enough), keep the part nearest the target
    if(calCand){ calCand.pts.push([rx, ry]); return; }
    calCand = {pts:[[rx, ry]], e:e};
    setTimeout(function(){
      if(!calCand || !calibrating) return;
      var pts = calCand.pts, ex = calCand.e, best = pts[0], bd = 9;
      for(var i=0;i<pts.length;i++){ var d = Math.hypot(pts[i][0]-ex.x, pts[i][1]-ex.y); if(d < bd){ bd = d; best = pts[i]; } }
      var sx = 0, sy = 0, n = 0;
      for(var j=0;j<pts.length;j++) if(Math.abs(pts[j][0]-best[0]) < 0.05 && Math.abs(pts[j][1]-best[1]) < 0.05){ sx += pts[j][0]; sy += pts[j][1]; n++; }
      calCand = null;
      calLast = Date.now();
      calRaw.push([sx/n, sy/n]);
      sfx.good();
      calStep++;
      if(calStep < CAL_PTS.length){ showCalTarget(); return; }
      finishCalibration();
    }, 150);
  }
  function finishCalibration(){
    var c = fit(calRaw, CAL_PTS);
    calibrating = false;
    $("calScreen").classList.add("hidden");
    $("startScreen").classList.remove("hidden");
    if(c){ cal = c; save(CAL_KEY, JSON.stringify(c)); }
    showCalStatus(c ? "Calibration saved ✓" : "Calibration failed — try again");
    startFocus = c ? 0 : 1; paintFocus();
  }
  function cancelCalibration(){
    calibrating = false; calCand = null;
    $("calScreen").classList.add("hidden");
    $("startScreen").classList.remove("hidden");
    showCalStatus(cal ? "Calibration cancelled — old calibration kept" : null);
  }
  // small dot where the camera currently detects something (before correction)
  function calFeedback(rx, ry){
    var d = document.createElement("div");
    d.className = "sdot";
    d.style.left = (rx*100) + "vw"; d.style.top = (ry*100) + "vh";
    $("calScreen").appendChild(d);
    setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, 600);
  }
  function showCalStatus(msg){
    var el = $("calStatus");
    el.textContent = msg || "Stand at your side of the wall · touch with one hand · pull back";
    el.classList.remove("warn");
  }
  showCalStatus();

  // ---- WALL TEST: the whole screen is touchable, divided into the sensor's own 8 x 4 grid.
  //      Raw camera data only (no calibration, no filters): each signal lights its cell.
  var sensorView = false, sensorCount = 0, sensorTimer = null, GRID_C = 8, GRID_R = 4, cellEls = [], cellCounts = [];
  var COLS = "ABCDEFGH";
  function buildGrid(){
    var scr = $("sensorScreen");
    for(var r=0;r<GRID_R;r++) for(var c=0;c<GRID_C;c++){
      var el = document.createElement("div");
      el.className = "gcell";
      el.style.left = (c*100/GRID_C) + "vw"; el.style.top = (r*100/GRID_R) + "vh";
      el.style.width = (100/GRID_C) + "vw"; el.style.height = (100/GRID_R) + "vh";
      el.innerHTML = '<b>' + COLS.charAt(c) + (r+1) + '</b><span>0</span>';
      scr.appendChild(el);
      cellEls.push(el);
    }
  }
  buildGrid();
  function startSensorView(){
    sensorView = true; sensorCount = 0;
    cellCounts = []; for(var i=0;i<cellEls.length;i++){ cellCounts.push(0); cellEls[i].lastChild.textContent = "0"; cellEls[i].classList.remove("seen"); }
    $("startScreen").classList.add("hidden");
    $("sensorScreen").classList.remove("hidden");
    clearInterval(sensorTimer);
    sensorTimer = setInterval(function(){
      $("sensorText").textContent = "WALL TEST — touch every cell · " + sensorCount + " signals/s · OK = exit";
      sensorCount = 0;
    }, 1000);
  }
  function stopSensorView(){
    sensorView = false; clearInterval(sensorTimer);
    $("sensorScreen").classList.add("hidden");
    $("startScreen").classList.remove("hidden");
  }
  function sensorDot(rx, ry){
    sensorCount++;
    var c = Math.min(GRID_C-1, Math.max(0, Math.floor(rx*GRID_C))), r = Math.min(GRID_R-1, Math.max(0, Math.floor(ry*GRID_R)));
    var k = r*GRID_C + c, el = cellEls[k];
    cellCounts[k]++;
    el.lastChild.textContent = cellCounts[k];
    el.classList.add("seen", "hit");
    clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove("hit"); }, 350);
    var d = document.createElement("div");
    d.className = "sdot";
    d.style.left = (rx*100) + "vw"; d.style.top = (ry*100) + "vh";
    $("sensorScreen").appendChild(d);
    setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, 1200);
  }

  // ---- what a wall touch may activate (nothing else reacts)
  function targetAt(x, y){
    var el = document.elementFromPoint(x, y);
    while(el && el !== document.body){
      if(el.classList && el.classList.contains("ans")) return el;
      if(el.id === "startBtn" || el.id === "againBtn" || el.id === "calBtn" || el.id === "sensorBtn") return el;
      el = el.parentNode;
    }
    return null;
  }
  function activate(el){
    if(el.id === "startBtn"){ audio(); if(!running) countdown(); }
    else if(el.id === "againBtn"){ audio(); if(againReady) countdown(); }
    else if(el.id === "calBtn"){ audio(); if(!running) startCalibration(); }
    else if(el.id === "sensorBtn"){ audio(); if(!running) startSensorView(); }
    else if(running){ hitBox(el); }
  }

  window.wallHit = function(rx, ry, id){
    wallRaw++;
    if(calibrating){ calHit(rx, ry); return; }
    if(sensorView){ sensorDot(rx, ry); return; }
    if(running){ gameVote(rx, ry); return; }
    if(!inCalArea(rx, ry)){ ghostBlocked++; return; }
    var m = mapPt(rx, ry), nx = m[0], ny = m[1];
    if(nx < EDGE || nx > 1-EDGE || ny < EDGE || ny > 1-EDGE) return;
    markCell(nx, ny);
    var now = Date.now(), aspect = window.innerWidth / window.innerHeight, c = null;
    contactsList = contactsList.filter(function(r){ return now - r.t < MERGE_MS; });
    for(var i=0;i<contactsList.length;i++){
      var dx = (contactsList[i].x - nx) * aspect, dy = contactsList[i].y - ny;
      if(Math.sqrt(dx*dx + dy*dy) < MERGE_DIST){ c = contactsList[i]; break; }
    }
    if(c){ c.t = now; c.n++; c.x = nx; c.y = ny; }
    else { c = {x:nx, y:ny, t:now, n:1, fired:false}; contactsList.push(c); }
    if(c.fired || c.n < CONFIRM) return;
    c.fired = true;
    var x = nx * window.innerWidth, y = ny * window.innerHeight;
    var el = targetAt(x, y);
    if(!el) return;                 // outside the squares/buttons: ignored, no circle
    if(isHot(nx, ny)){ ghostBlocked++; return; }
    var side = el.getAttribute && el.getAttribute("data-p");
    if(side && now < settleUntil[+side]){ ghostBlocked++; return; }
    wallHits++;
    dot(x, y);
    activate(el);
  };
  // ---- GAME INPUT (v2.1): built on the Wall Test results
  //  * the sensor grid is 8 columns x 4 rows; positions are accurate
  //  * it sees the whole arm/body, so: columns A and H (where players stand) are ignored,
  //    answers sit in row 1 (top) and row 4 (bottom) so reaching one never crosses the other,
  //    and when signals start on a side we count for VOTE_MS and pick the square with MOST signals
  var VOTE_MS = 300, COOLDOWN_MS = 700;
  var votes = {1:null, 2:null}, coolUntil = {1:0, 2:0};
  function gameVote(rx, ry){
    var col = Math.floor(rx * 8), row = Math.floor(ry * 4);
    if(col <= 0 || col >= 7) return;                         // standing zones A and H
    var p = col <= 2 ? 1 : (col >= 5 ? 2 : 0);               // B-C = player 1, F-G = player 2
    var i = row === 0 ? 0 : (row === 3 ? 1 : -1);            // row 1 = top answer, row 4 = bottom answer
    if(!p || i < 0) return;
    var now = Date.now();
    if(now < coolUntil[p] || now < settleUntil[p] || locked[p] || !accepting) return;
    var v = votes[p];
    if(!v){
      v = votes[p] = {n:[0,0], last:[null,null]};
      setTimeout(function(){ decide(p); }, VOTE_MS);
    }
    v.n[i]++; v.last[i] = [rx, ry];
  }
  function decide(p){
    var v = votes[p]; votes[p] = null;
    if(!v || !running) return;
    var i = v.n[1] > v.n[0] ? 1 : 0;
    coolUntil[p] = Date.now() + COOLDOWN_MS;
    var el = document.querySelector('.ans.p' + p + '[data-i="' + i + '"]');
    wallHits++;
    if(v.last[i]) dot(v.last[i][0] * window.innerWidth, v.last[i][1] * window.innerHeight);
    hitBox(el);
  }

  var tuioText = "";
  window.tuioStatus = function(t){ tuioText = t; report("tuio"); };

  // ---- remote control: arrows choose START / CALIBRATE, OK presses it
  var startFocus = 0, FOCUS_IDS = ["startBtn", "sensorBtn"];
  function paintFocus(){
    for(var i=0;i<FOCUS_IDS.length;i++) $(FOCUS_IDS[i]).classList.toggle("focus", startFocus === i);
  }
  paintFocus();
  document.addEventListener("keydown", function(e){
    var k = e.keyCode;
    var onStart = !$("startScreen").classList.contains("hidden");
    if(sensorView && (k === 13 || k === 23 || k === 32 || k === 4 || k === 27)){ stopSensorView(); return; }
    if(onStart && (k === 37 || k === 38 || k === 39 || k === 40)){ startFocus = 1 - startFocus; paintFocus(); return; }
    if(k === 13 || k === 23 || k === 32 || e.key === "Enter"){
      audio();
      if(calibrating){ cancelCalibration(); return; }
      if(onStart){ if(startFocus === 0) countdown(); else startSensorView(); }
      else if(!$("endScreen").classList.contains("hidden") && againReady) countdown();
    }
  });

  // ---------------- flow ----------------
  function updateScores(flash){
    $("score1").textContent = score[1]; $("score2").textContent = score[2];
    $("bar1").style.width = (score[1]/WIN_SCORE*100) + "%";
    $("bar2").style.width = (score[2]/WIN_SCORE*100) + "%";
    if(flash){ var pl = $("plus"+flash); pl.classList.remove("show"); void pl.offsetWidth; pl.classList.add("show"); }
  }
  function showTime(){
    var m = Math.floor(timeLeft/60), s = timeLeft%60;
    $("timer").textContent = m + ":" + (s<10?"0":"") + s;
    $("timer").classList.toggle("low", timeLeft <= 10);
  }
  function countdown(){
    $("startScreen").classList.add("hidden"); $("endScreen").classList.add("hidden");
    $("countScreen").classList.remove("hidden");
    clearConfetti();
    score = {1:0,2:0}; locked = {1:false,2:false}; updateScores(); timeLeft = GAME_SECS; showTime();
    $("question").textContent = "?"; fitText($("question"), 11);
    boxes.forEach(function(b){ b.textContent = ""; b.classList.remove("good","wrong"); });
    var n = 3;
    var show = function(){
      var el = $("countNum");
      el.textContent = n > 0 ? n : "GO!";
      el.style.animation = "none"; void el.offsetWidth; el.style.animation = "";
      if(n > 0){ sfx.beep(); n--; setTimeout(show, 900); }
      else { sfx.go(); setTimeout(startGame, 700); }
    };
    show();
  }
  function startGame(){
    $("countScreen").classList.add("hidden");
    running = true;
    nextQuestion();
    clearInterval(tick);
    tick = setInterval(function(){
      timeLeft--; showTime();
      if(timeLeft <= 0){ endGame("time’s up!"); }
    }, 1000);
  }
  function endGame(why){
    if(!running) return;
    running = false; accepting = false; clearInterval(tick);
    var w = $("winText");
    w.className = "win";
    if(score[1] > score[2]){ w.textContent = "PLAYER 1 WINS!"; w.classList.add("p1c"); }
    else if(score[2] > score[1]){ w.textContent = "PLAYER 2 WINS!"; w.classList.add("p2c"); }
    else { w.textContent = "IT’S A DRAW!"; w.classList.add("draw"); }
    $("final1").textContent = score[1]; $("final2").textContent = score[2];
    $("reason").textContent = why.charAt(0).toUpperCase() + why.slice(1);
    againReady = false;
    var ab = $("againBtn"); ab.classList.add("wait");
    setTimeout(function(){ againReady = true; ab.classList.remove("wait"); }, AGAIN_DELAY);
    $("endScreen").classList.remove("hidden");
    sfx.win(); confetti();
  }
  function confetti(){
    var cols = ["#16CFF2","#FF7A1A","#FFC929","#7CE33A","#FF2E93","#FFFFFF"];
    for(var i=0;i<70;i++){
      var c = document.createElement("div");
      c.className = "confetti";
      c.style.left = Math.random()*100 + "vw";
      c.style.background = cols[i%cols.length];
      c.style.animationDuration = (2.2 + Math.random()*2.2) + "s";
      c.style.animationDelay = (Math.random()*0.8) + "s";
      $("endScreen").appendChild(c);
    }
  }
  function clearConfetti(){
    Array.prototype.slice.call(document.querySelectorAll(".confetti")).forEach(function(c){ c.parentNode.removeChild(c); });
  }

  // ---------------- touch tester (test build) ----------------
  var counts = {}, dbg = $("dbg");
  var chromeVer = (navigator.userAgent.match(/Chrome\/([0-9.]+)/) || [,"?"])[1];
  function dot(x, y){
    var d = document.createElement("div");
    d.className = "tdot"; d.style.left = x + "px"; d.style.top = y + "px";
    document.body.appendChild(d);
    setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, 1300);
  }
  function report(type, x, y){
    if(type !== "tuio") counts[type] = (counts[type]||0) + 1;
    var parts = [];
    for(var k in counts){ parts.push(k + ":" + counts[k]); }
    dbg.textContent = (tuioText ? "WALL " + tuioText + " | taps " + wallHits + "/" + wallRaw + " ghosts " + ghostBlocked + " | " : "") + "WebView " + chromeVer + " | " + window.innerWidth + "x" + window.innerHeight +
      " | last: " + type + (x!=null ? " @" + Math.round(x) + "," + Math.round(y) : "") + " | " + parts.join(" ");
  }
  function watch(type){
    document.addEventListener(type, function(e){
      var p = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
      if(p && p.clientX != null){ dot(p.clientX, p.clientY); report(type, p.clientX, p.clientY); }
      else { report(type); }
    }, true);
  }
  ["touchstart","pointerdown","mousedown","click"].forEach(watch);
  document.addEventListener("keydown", function(e){ report("key " + (e.keyCode||e.key)); }, true);
  report("ready");

  // test hook (used only for automated checks)
  window.__md = { state:function(){ return {score:score, answers:answers, correct:correct, timeLeft:timeLeft, running:running, accepting:accepting, locked:locked}; },
                  setTime:function(s){ timeLeft = s; showTime(); } };
})();
</script>
</body>
