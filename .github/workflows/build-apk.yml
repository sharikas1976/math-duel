name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the APK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          gradle assembleDebug --no-daemon

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MathDuel.apk
          cp inspector/build/outputs/apk/debug/inspector-debug.apk WallInspector.apk

      - name: Keep APK as a build file
        uses: actions/upload-artifact@v4
        with:
          name: MathDuel-apk
          path: |
            MathDuel.apk
            WallInspector.apk

      - name: Publish as a release (easy download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Math Duel build ${{ github.run_number }}
          files: |
            MathDuel.apk
            WallInspector.apk
